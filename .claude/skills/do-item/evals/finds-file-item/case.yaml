schema_version: "1.1"
name: finds-file-item
expected_outcome: |
  The session finds F1 in docs/reviews/findings.md (a file item, before MIG-5), sees that it is blocked by the open file item F2, changes no file, and says what it waits for.
context:
  scaffold_script: world.sh
execution:
  append_system_prompt: "This workspace is an offline fixture of a repository. `gh` is not available: before any `gh` call, read `.gh/README.md`, which maps each call to its saved output. The repository is the current working directory: read its files by paths relative to it (`docs/plans/README.md`), not under the skill's base directory."
