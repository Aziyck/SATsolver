name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit and API tests
        env:
          # Missing web dependencies must fail the run, not skip the API tests.
          WIZSAT_REQUIRE_API_TESTS: "1"
        run: python -m unittest discover -s tests -v
      - name: Solver smoke benchmark
        run: python scripts/benchmark_cdcl.py

  pypy:
    # The server stays on CPython; only the solvers run under PyPy (docs/plans/done/pypy-solver-runner.md).
    name: Solvers under PyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: pypy
        with:
          python-version: pypy3.10
      # Set up last, so `python` is this CPython.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Solver agreement under PyPy
        env:
          PYPY: ${{ steps.pypy.outputs.python-path }}
        run: |
          "$PYPY" --version
          "$PYPY" -m unittest discover -s tests -p test_solver_agreement.py -v
      - name: Jobs and benchmarks with the solvers in a PyPy child
        env:
          WIZSAT_REQUIRE_API_TESTS: "1"
          WIZSAT_TEST_SOLVER_PYTHON: ${{ steps.pypy.outputs.python-path }}
        # The test falls back to this CPython when the path is empty; refuse anything but PyPy first.
        run: |
          "$WIZSAT_TEST_SOLVER_PYTHON" -c "import platform, sys; print(platform.python_implementation()); sys.exit(platform.python_implementation() != 'PyPy')"
          python -m unittest discover -s tests -p test_api.py -k test_a_solve_job_and_benchmarks_give_the_same_results_through_the_child -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Build the web UI
        working-directory: frontend
        run: npm run build
      - name: Playwright
        working-directory: frontend
        env:
          WIZSAT_PYTHON: python
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
